# fly.toml app configuration file generated for fulfill-paperalien on 2026-04-18T15:56:40-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fulfill-paperalien'
primary_region = 'lax'

[build]
  [build.args]
    VITE_SUPABASE_URL = "https://jxdhdyxivyrmkeuxisre.supabase.co"
    VITE_SUPABASE_ANON_KEY = "sb_publishable_fFBBT56oDE0jr7y7VCeCEw_FFVr6Wdc"

[deploy]
  release_command = "pnpm -F @workspace/db run push"

[env]
  # Public origin of the app — used to build workspace invitation links.
  # The app is served at the root of its own subdomain.
  APP_URL = "https://fulfill.paperalien.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine always on: avoids cold-start latency on the first request
  # after idle, and lets the in-process trash-purge scheduler run reliably.
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[[http_service.checks]]
  type = "http"
  path = "/api/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
